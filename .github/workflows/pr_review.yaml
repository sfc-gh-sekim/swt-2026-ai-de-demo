name: Semantic View PR Review (Cortex Code)

# semantic view 모델을 건드리는 PR이 올라오면, Cortex Code를 배치 모드로 실행해 이
# 프로젝트의 `semantic-view-authoring` 스킬로 변경 사항이 스펙과 메타데이터 규칙을
# 지키는지 리뷰하고, 그 결과를 PR 코멘트로 남깁니다.
#
# 참고: 이 리뷰는 어디까지나 참고용입니다. 실제 배포는 deploy_dbt_project.yaml에서
# Snowflake CLI만으로 진행합니다. Cortex Code는 배포를 하지 않습니다.
#
# 필요한 repo secret:
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD

on:
  pull_request:
    paths:
      - 'dbt_project/models/marts/sv_*.sql'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 변경 파일을 diff하려면 base 브랜치가 필요합니다

      - name: 변경된 semantic view 모델 확인
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only "$base"...HEAD -- 'dbt_project/models/marts/sv_*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "변경된 semantic view 파일: $files"

      - name: Cortex Code용 Snowflake 연결 설정
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml <<EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          EOF
          chmod 600 ~/.snowflake/connections.toml

      - name: Cortex Code CLI 설치
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cortex Code로 semantic view 리뷰 실행
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          cortex --allowed-tools "Read" "Grep" -p "semantic-view-authoring 스킬을 써서 변경된 semantic view 모델을 리뷰해 주세요: ${CHANGED_FILES}. 스킬의 'PR Review checklist' 항목과 구조(Pass / Fail 그룹, file:line 참조, 항목별 수정 방안)를 따르되, **리뷰 결과는 반드시 한국어로 작성하세요**. 스킬 문서가 영어로 쓰여 있어도 출력 언어는 한국어입니다. 섹션 제목도 '통과' / '실패'로 쓰세요. SQL 식별자, 절 이름(TABLES, METRICS 등), 파일 경로는 원문 그대로 두세요. 파일은 하나도 수정하지 마세요." \
            > review.md 2>/dev/null || true
          echo "----- review.md -----"; cat review.md

      - name: 리뷰 결과를 PR 코멘트로 등록
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Semantic View 리뷰 (Cortex Code)\n\n';
            try { body += fs.readFileSync('review.md', 'utf8'); }
            catch (e) { body += '_리뷰 결과가 생성되지 않았습니다._'; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
